<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick a challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#FBF7EE;color:#3A2E2A}
a{color:#3A2E2A}a:hover{color:#000}
*{font-variant-ligatures:no-common-ligatures}
</style>
</head>
<body style="display:flex;justify-content:center">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7EE; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 20px; font-family: 'DM Sans', sans-serif; color: #3A2E2A">
<nav style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ecc2b0">
<a href="home.html" style="padding: 12px 4px; font-size: 17px; font-weight: 500; text-decoration: none; color: #7A6A62; border-bottom: 3px solid transparent">Journal</a>
<a href="write.html" style="padding: 12px 4px; font-size: 17px; font-weight: 500; text-decoration: none; color: #7A6A62; border-bottom: 3px solid transparent">Write</a>
<a href="pick-a-challenge.html" style="padding: 12px 4px; font-size: 17px; font-weight: 700; text-decoration: none; border-bottom: 3px solid #3A2E2A">Challenge mode</a>
</nav>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #7A6A62">Today's prompt</div>
<p style="margin: 0; font-family: Fraunces, serif; font-size: 22px; font-weight: 500; line-height: 1.3">Write about a door in your town that only opens at midnight.</p>
</div>

<h1 style="margin: 0; font-size: 18px; font-weight: 700">Pick your level</h1>

<div style="display: flex; flex-direction: column; gap: 12px">
<button style="display: flex; justify-content: space-between; align-items: center; min-height: 72px; padding: 0 20px; border-radius: 16px; background: #ffffff; border: 2px solid #ecc2b0; font-family: inherit; color: inherit; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 18px">Easy</strong><span style="font-size: 14px; color: #7A6A62">Just the prompt</span></span>
<span style="width: 22px; height: 22px; border-radius: 12px; border: 2px solid #ecc2b0"></span>
</button>
<button style="display: flex; justify-content: space-between; align-items: center; min-height: 72px; padding: 0 20px; border-radius: 16px; background: #FBE3EA; border: 2px solid #3A2E2A; font-family: inherit; color: inherit; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 18px">Medium</strong><span style="font-size: 14px; color: #6B5A52">Prompt + 3 word bank words</span></span>
<span style="width: 22px; height: 22px; border-radius: 12px; border: 7px solid #3A2E2A; box-sizing: border-box"></span>
</button>
<button style="display: flex; justify-content: space-between; align-items: center; min-height: 72px; padding: 0 20px; border-radius: 16px; background: #ffffff; border: 2px solid #ecc2b0; font-family: inherit; color: inherit; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 18px">Hard</strong><span style="font-size: 14px; color: #7A6A62">Prompt + 5 harder words</span></span>
<span style="width: 22px; height: 22px; border-radius: 12px; border: 2px solid #ecc2b0"></span>
</button>
</div>

<div style="background: #eedda3; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Your words today</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 8px 16px; border-radius: 20px; background: #ffffff; font-size: 16px; font-weight: 500">lantern</span>
<span style="padding: 8px 16px; border-radius: 20px; background: #ffffff; font-size: 16px; font-weight: 500">hollow</span>
<span style="padding: 8px 16px; border-radius: 20px; background: #ffffff; font-size: 16px; font-weight: 500">whisper</span>
</div>
</div>

<a href="write.html" style="margin-top: auto; display: flex; justify-content: center; align-items: center; height: 56px; border-radius: 28px; background: #eea9bc; color: #3A2E2A; font-size: 17px; font-weight: 700; text-decoration: none">Start writing</a>
</div>
</body>
</html>
