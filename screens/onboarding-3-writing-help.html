<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#FBF7EE;color:#3A2E2A}

</style>
</head>
<body style="display:flex;justify-content:center">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7EE; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 28px; font-family: 'DM Sans', sans-serif; color: #3A2E2A">

<div style="text-align: center; font-size: 17px; font-weight: 500; color: #7A6A62">Onboarding questions</div>

<div style="display: flex; align-items: flex-start; gap: 12px">
<span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; background: #ecc2b0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">3</span>
<h1 style="margin: 0; font-family: Fraunces, serif; font-size: 26px; font-weight: 700; line-height: 1.25">How can we help you improve your writing?</h1>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<button aria-pressed="true" data-color="#ecc2b0" style="display: flex; align-items: center; gap: 10px; min-height: 88px; padding: 0 14px; border: 2.5px solid #ecc2b0; border-radius: 16px; background: #ecc2b0; font-family: inherit; font-size: 16px; font-weight: 500; color: #3A2E2A; text-align: left"><span style="flex-shrink: 0; width: 22px; height: 22px; box-sizing: border-box; border: 1.5px solid #3A2E2A; border-radius: 6px; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="visibility: visible"><path d="M5 12l5 5 9-10"></path></svg></span>Word banks</button>
<button aria-pressed="false" data-color="#eea9bc" style="display: flex; align-items: center; gap: 10px; min-height: 88px; padding: 0 14px; border: 2.5px solid #eea9bc; border-radius: 16px; background: #ffffff; font-family: inherit; font-size: 16px; font-weight: 500; color: #3A2E2A; text-align: left"><span style="flex-shrink: 0; width: 22px; height: 22px; box-sizing: border-box; border: 1.5px solid #3A2E2A; border-radius: 6px; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="visibility: hidden"><path d="M5 12l5 5 9-10"></path></svg></span>Timers</button>
<button aria-pressed="false" data-color="#eedda3" style="grid-column: span 2; display: flex; align-items: center; gap: 10px; min-height: 88px; padding: 0 14px; border: 2.5px solid #eedda3; border-radius: 16px; background: #ffffff; font-family: inherit; font-size: 16px; font-weight: 500; color: #3A2E2A; text-align: left"><span style="flex-shrink: 0; width: 22px; height: 22px; box-sizing: border-box; border: 1.5px solid #3A2E2A; border-radius: 6px; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg class="check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A2E2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="visibility: hidden"><path d="M5 12l5 5 9-10"></path></svg></span>Word/character goals</button>
</div>

<nav style="margin-top: auto; display: flex; justify-content: space-between; align-items: center">
<a href="onboarding-2-topics.html" style="width: 80px; min-height: 44px; display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>back</a>
<div style="display: flex; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #eedda3; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500">1</span>
<span style="width: 36px; height: 36px; border-radius: 10px; background: #eedda3; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500">2</span>
<span style="width: 36px; height: 36px; border-radius: 10px; background: #eea9bc; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">3</span>
</div>
<a href="home.html" style="width: 80px; min-height: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 16px; font-weight: 700; text-decoration: none">submit<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
</nav>
</div>
<script>
// Tap an option to select it: the box fills with its color and shows a check.
document.querySelectorAll('button[aria-pressed]').forEach(function (b) {
  b.addEventListener('click', function () {
    var on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    b.style.background = on ? b.dataset.color : '#ffffff';
    b.querySelector('.check').style.visibility = on ? 'visible' : 'hidden';
  });
});
</script>
</body>
</html>
